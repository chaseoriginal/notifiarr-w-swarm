services:
  notifiarr:
    container_name: notifiarr-w-swarm_notifiarr
    hostname: notifiarr-w-swarm
    image: golift/notifiarr:latest
    ports:
    - target: 5454
      published: 5454
      protocol: tcp
      mode: host
    deploy:
      placement:
        constraints:
        - node.labels.deployment.target.notifiarr == true
      restart_policy:
        condition: any
    volumes:
    - /var/lib/docker/volumes/notifiarr-w-swarm/config:/config
    - /var/run/utmp:/var/run/utmp
    - /etc/machine-id:/etc/machine-id
volumes: {}
